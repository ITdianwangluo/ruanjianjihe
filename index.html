    <style>
        :root {
            --orange: #f97316;
            --dark-bg: #0a0e14;
            --card-bg: #14181f;
            --border-color: #1f2937;
            --text-gray: #6b7280;
        }
        body { font-family: 'Noto Sans SC', sans-serif; background-color: var(--dark-bg); color: #e5e7eb; margin: 0; }
        .text-brand-orange { color: var(--orange); }
        .gradient-text { background: linear-gradient(135deg, var(--orange), #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .btn-brand { background: linear-gradient(135deg, var(--orange), #ea580c); color: white; border: none; transition: all 0.3s ease; font-weight: 500; padding: 0.75rem 2rem; border-radius: 0.5rem; }
        .btn-brand:hover { background: linear-gradient(135deg, #fb923c, var(--orange)); box-shadow: 0 0 20px rgba(249,115,22,0.4); transform: translateY(-2px); }
        .btn-outline { background: transparent; border: 1px solid #d1d5db; color: #d1d5db; padding: 0.75rem 2rem; border-radius: 0.5rem; font-weight: 500; transition: all 0.3s ease; cursor: pointer; }
        .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: white; color: white; }
        .section-title { font-size: 2.25rem; font-weight: 700; text-align: center; margin-bottom: 1rem; }
        .divider-custom { width: 60px; height: 4px; background: linear-gradient(135deg, var(--orange), #fbbf24); margin: 1rem auto; border-radius: 2px; }
        .nav-container { position: relative; }
        .mega-menu {
            position: absolute; left: 0; width: 100vw; top: 100%; margin-top: 0;
            background-color: white; border-top: 1px solid rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 20px 40px -8px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.03) inset;
            z-index: 50; border-radius: 0 0 20px 20px;
            max-height: 0; overflow: hidden; opacity: 0;
            transform: translateY(-8px); pointer-events: none;
            transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1),
                        opacity 0.4s cubic-bezier(0.4,0,0.2,1),
                        transform 0.45s cubic-bezier(0.4,0,0.2,1),
                        visibility 0.4s;
            visibility: hidden;
        }
        .mega-menu.active { max-height: 800px; opacity: 1; transform: translateY(0); visibility: visible; pointer-events: auto; }
        .mega-menu .text-gray-400 { color: var(--text-gray); } .mega-menu a { color: #1f2937; } .mega-menu a:hover { color: var(--orange); }
        nav.nav-container { background-color: rgba(10,14,20,0.95); border-bottom: 1px solid rgba(31,41,55,0.2); transition: background-color 0.35s ease, border-bottom-color 0.35s ease; }
        nav.nav-container .logo-text, nav.nav-container .nav-link { transition: color 0.35s ease; }
        nav.nav-container.nav-white { background-color: white !important; border-bottom-color: #e5e7eb !important; }
        nav.nav-container.nav-white .logo-text { color: black !important; } nav.nav-container.nav-white .nav-link { color: black !important; }
        nav.nav-container.nav-white .btn-outline { border-color: #9ca3af; color: #374151; }
        nav.nav-container.nav-white .btn-outline:hover { background: #f3f4f6; border-color: #4b5563; color: #111827; }
        .auth-required { display: none !important; }
        body.logged-in .auth-required { display: inline-flex !important; }
        body.logged-in .add-menu-item-btn.auth-required { display: block !important; }
        body.logged-in .menu-item-actions button.auth-required { display: inline-block !important; }
        body.logged-in .champion-actions { display: inline-flex !important; }
        .menu-item-wrapper { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
        .menu-item-link { flex: 1; min-width: 0; }
        .menu-item-actions { display: inline-flex; gap: 2px; opacity: 0; transition: opacity 0.2s; }
        .menu-item-wrapper:hover .menu-item-actions { opacity: 1; }
        .menu-item-actions button { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px 4px; color: #9ca3af; border-radius: 4px; }
        .menu-item-actions button:hover { color: var(--orange); background: rgba(249,115,22,0.08); }
        .cat-actions { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
        .cat-actions button { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px 4px; color: #9ca3af; border-radius: 4px; }
        .cat-actions button:hover { color: var(--orange); background: rgba(249,115,22,0.08); }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: flex; align-items: center;
            justify-content: center; z-index: 10001; visibility: hidden;
            opacity: 0; transition: opacity 0.3s, visibility 0.3s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-box {
            background: white; border-radius: 16px; padding: 24px;
            width: 90%; max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transform: scale(0.95); transition: transform 0.3s;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-box h3 { font-size: 1.5rem; font-weight: 700; color: #111827; margin-bottom: 20px; }
        .modal-box label { font-size: 14px; font-weight: 500; color: #374151; display: block; margin-bottom: 4px; }
        .modal-box input, .modal-box select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; margin-bottom: 16px; outline: none; }
        .modal-box input:focus, .modal-box select:focus { border-color: var(--orange); }
        .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .modal-actions button { padding: 10px 20px; border-radius: 8px; font-weight: 500; cursor: pointer; border: none; }
        .btn-cancel { background: #f3f4f6; color: #374151; } .btn-cancel:hover { background: #e5e7eb; }
        .btn-submit { background: var(--orange); color: white; } .btn-submit:hover { background: #ea580c; }
        .btn-delete { background: #ef4444; color: white; } .btn-delete:hover { background: #dc2626; }
        .add-menu-item-btn { display: block; margin: 24px auto 0; padding: 8px 24px; border-radius: 8px; background: transparent; border: 1px dashed #d1d5db; color: var(--text-gray); cursor: pointer; font-size: 14px; text-align: center; }
        .add-menu-item-btn:hover { border-color: var(--orange); color: var(--orange); background: rgba(249,115,22,0.05); }
        .add-category-btn { display: block; margin: 16px auto 0; padding: 8px 24px; border-radius: 8px; background: transparent; border: 1px dashed #d1d5db; color: var(--text-gray); cursor: pointer; font-size: 14px; text-align: center; }
        .add-category-btn:hover { border-color: var(--orange); color: var(--orange); background: rgba(249,115,22,0.05); }
        .add-champion-btn { background: transparent; border: 1px solid #d1d5db; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; color: #374151; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; }
        .carousel-arrow { position: absolute; top: 50%; transform: translateY(-50%); font-size: 2.5rem; color: rgba(255,255,255,0.6); cursor: pointer; z-index: 10; background: none; border: none; }
        .carousel-arrow:hover { color: white; } .carousel-arrow.left { left: 0; } .carousel-arrow.right { right: 0; }
        .indicator-dot { width: 10px; height: 10px; border-radius: 50%; background-color: rgba(255,255,255,0.4); cursor: pointer; border: none; }
        .indicator-dot.active { background-color: var(--orange); }
        .champion-item-wrapper { position: relative; }
        .champion-actions { position: absolute; top: 8px; right: 8px; display: none; gap: 4px; background: rgba(255,255,255,0.9); padding: 4px; border-radius: 6px; z-index: 5; }
        .champion-item-wrapper:hover .champion-actions { display: inline-flex; }
        .champion-actions button { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px 4px; color: var(--text-gray); border-radius: 4px; }
        .champion-actions button:hover { color: var(--orange); background: rgba(249,115,22,0.08); }

        /* 左下角小三角登录按钮 */
        .login-corner-btn {
            position: fixed; left: 0; bottom: 0;
            width: 0; height: 0;
            border-bottom: 10px solid #f97316;
            border-right: 10px solid transparent;
            cursor: pointer;

        }
        .login-corner-btn:hover { border-bottom-color: #fb923c; filter: drop-shadow(0 0 4px rgba(249,115,22,0.6)); }
        body.logged-in .login-corner-btn { border-bottom-color: #10b981; }
        body.logged-in .login-corner-btn:hover { border-bottom-color: #34d399; }
    </style>

    <script>
        // ---------- 1. JSONBin 配置（请务必替换） ----------
        const JSONBIN_CONFIG = {
            BIN_ID: '69dbd856856a682189277538',          // 替换为你的 Bin ID
            ACCESS_KEY: '$2a$10$d8Wh7LFKYdzR9v/9BRiX3OI5Wex3ZHvpih3ySS4pAUesYeXZMI4Tq',  // 替换为你的 Access Key
            API_BASE: 'https://api.jsonbin.io/v3/b'
        };

        const apiClient = {
            headers() { return { 'Content-Type': 'application/json', 'X-Access-Key': JSONBIN_CONFIG.ACCESS_KEY }; },
            async read() {
                const res = await fetch(`${JSONBIN_CONFIG.API_BASE}/${JSONBIN_CONFIG.BIN_ID}/latest`, { headers: this.headers() });
                if (!res.ok) throw new Error('读取云端数据失败');
                const json = await res.json();
                return json.record;
            },
            async update(data) {
                const res = await fetch(`${JSONBIN_CONFIG.API_BASE}/${JSONBIN_CONFIG.BIN_ID}`, {
                    method: 'PUT', headers: this.headers(), body: JSON.stringify(data)
                });
                if (!res.ok) throw new Error('更新云端数据失败');
                const json = await res.json();
                return json.record;
            }
        };

        // 默认数据
        function getDefaultData() {
            return {
                menus: {
                    app: { categories: [ { name:'办公效率', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] }, { name:'浏览器&通讯', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] }, { name:'影音娱乐', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] }, { name:'其他常用', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] } ] },
                    driver: { categories: [ { name:'显卡驱动', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] }, { name:'主板/芯片组', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] }, { name:'外设驱动', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] }, { name:'驱动工具', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] } ] },
                    design: { categories: [ { name:'平面设计', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] }, { name:'UI/UX设计', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] }, { name:'3D建模/渲染', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] }, { name:'视频剪辑', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] } ] },
                    system: { categories: [ { name:'Windows', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] }, { name:'Linux 发行版', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] }, { name:'macOS / 其他', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] } ] },
                    tool: { categories: [ { name:'系统优化', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] }, { name:'文件处理', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] }, { name:'网络工具', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] }, { name:'安全软件', fontSize:'sm', fontWeight:'normal', color:'#9ca3af', link:'', items:[] } ] }
                },
                champions: [
                    { name:'Office 2021', link:'https://www.office.com', contributor:'软件中心', iconUrl:'' },
                    { name:'Photoshop', link:'https://www.adobe.com/photoshop', contributor:'设计师小刘', iconUrl:'' },
                    { name:'NVIDIA 驱动', link:'https://www.nvidia.com/download', contributor:'硬件控', iconUrl:'' },
                    { name:'Windows 11', link:'https://www.microsoft.com/windows', contributor:'微软官方', iconUrl:'' },
                    { name:'火绒安全', link:'https://www.huorong.cn', contributor:'安全达人', iconUrl:'' }
                ],
                slides: [
                    { title:'一站式<span class="gradient-text">软件下载</span>中心', desc:'覆盖应用、驱动、设计、镜像与工具五大类别', sub:'安全、纯净、无捆绑，海量软件资源免费高速下载', btnText:'浏览全部软件', btnLink:'#', btnColor:'#f97316', bgColor:'' },
                    { title:'全新<span class="gradient-text">设计工具</span>推荐', desc:'精选设计师必备软件，提升创作效率', sub:'从平面到3D，一站式获取所需工具', btnText:'查看设计软件', btnLink:'#', btnColor:'#f97316', bgColor:'' },
                    { title:'系统镜像<span class="gradient-text">高速下载</span>', desc:'Windows、Linux、macOS 原版镜像', sub:'纯净安全，告别捆绑', btnText:'下载镜像', btnLink:'#', btnColor:'#f97316', bgColor:'' }
                ]
            };
        }

        let appData;
        async function loadData() {
            try {
                const remote = await apiClient.read();
                localStorage.setItem('software_center_cache', JSON.stringify(remote));
                return remote;
            } catch (e) {
                console.warn('云端加载失败，使用本地缓存', e);
                const cached = localStorage.getItem('software_center_cache');
                return cached ? JSON.parse(cached) : getDefaultData();
            }
        }
        async function saveData(data) {
            try {
                await apiClient.update(data);
                localStorage.setItem('software_center_cache', JSON.stringify(data));
            } catch (e) {
                alert('保存失败，请检查网络连接与 JSONBin 配置。');
                console.error(e);
            }
        }

        const sizeMap = { xs:'0.75rem', sm:'0.875rem', base:'1rem', lg:'1.125rem' };
        const menuKeys = ['app','driver','design','system','tool'];

        function renderAllMenus() {
            menuKeys.forEach(key => {
                const menu = appData.menus[key];
                const grid = document.getElementById(`menu-${key}-grid`);
                if (!grid) return;
                grid.innerHTML = menu.categories.map((cat, catIdx) => `
                    <div class="space-y-3" data-cat="${cat.name}" data-menu="menu-${key}" data-cat-index="${catIdx}">
                        <div style="display:flex;align-items:center;margin-bottom:8px;">
                            <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider cat-title" style="font-size:${sizeMap[cat.fontSize]}; font-weight:${cat.fontWeight}; color:${cat.color};">${cat.name}</h4>
                            <span class="cat-actions auth-required"><button onclick="quickAddToCat(this)"><i class="ri-add-line"></i></button><button onclick="editCategory(this)"><i class="ri-edit-line"></i></button></span>
                        </div>
                        ${cat.items.map(item => `
                            <div class="menu-item-wrapper">
                                <a href="${item.link || '#'}" target="_blank" rel="noopener" class="menu-item-link block hover:text-brand-orange transition-colors">${item.name}</a>
                                <span class="menu-item-actions"><button title="编辑" class="auth-required" onclick="editMenuItem(this)"><i class="ri-edit-line"></i></button><button title="删除" class="auth-required" onclick="deleteMenuItem(this)"><i class="ri-delete-bin-line"></i></button></span>
                            </div>
                        `).join('')}
                    </div>
                `).join('');
            });
        }
        function renderChampions() {
            const grid = document.getElementById('championGrid');
            grid.innerHTML = appData.champions.map((ch, idx) => `
                <div class="champion-item-wrapper" data-champion-index="${idx}">
                    <a href="${ch.link}" target="_blank" rel="noopener" class="bg-white border border-gray-200 rounded-xl p-6 text-center hover:border-brand-orange hover:shadow-lg transition-all cursor-pointer no-underline block">
                        ${ch.iconUrl ? `<img src="${ch.iconUrl}" class="mx-auto w-8 h-8 mb-3 object-contain" onerror="this.style.display='none';this.nextSibling.style.display='block';"><i class="ri-apps-2-fill text-3xl text-brand-orange mb-3 block" style="display:none;"></i>` : `<i class="${randomIcon()} text-3xl text-brand-orange mb-3 block"></i>`}
                        <span class="text-gray-700 block font-medium champion-text">${ch.name}</span>
                        <span class="text-xs text-gray-400 block mt-1">贡献者：${ch.contributor}</span>
                    </a>
                    <div class="champion-actions auth-required"><button onclick="editChampionItem(this)"><i class="ri-edit-line"></i></button><button onclick="deleteChampionItem(this)"><i class="ri-delete-bin-line"></i></button></div>
                </div>
            `).join('');
        }
        function randomIcon() { const icons = ['ri-install-fill','ri-download-cloud-2-fill','ri-apps-2-fill','ri-stack-fill','ri-archive-fill','ri-play-circle-fill','ri-computer-fill']; return icons[Math.floor(Math.random()*icons.length)]; }

        // 所有操作函数（均保存到云端）
        window.quickAddToCat = async (btn) => {
            const cat = btn.closest('[data-cat]');
            const name = prompt(`在“${cat.dataset.cat}”中添加软件名称：`);
            if (!name || !name.trim()) return;
            const link = prompt('跳转链接（可选）：', '#');
            const key = cat.dataset.menu.replace('menu-','');
            const catIdx = parseInt(cat.dataset.catIndex);
            appData.menus[key].categories[catIdx].items.push({ name: name.trim(), link: link && link.trim() ? link.trim() : '#' });
            await saveData(appData); renderAllMenus();
        };
        window.editMenuItem = async (btn) => {
            const wrapper = btn.closest('.menu-item-wrapper');
            const cat = wrapper.closest('[data-cat]');
            const key = cat.dataset.menu.replace('menu-','');
            const catIdx = parseInt(cat.dataset.catIndex);
            const items = appData.menus[key].categories[catIdx].items;
            const itemIdx = Array.from(cat.querySelectorAll('.menu-item-wrapper')).indexOf(wrapper);
            const item = items[itemIdx];
            const newName = prompt('修改名称：', item.name);
            if (newName && newName.trim()) item.name = newName.trim();
            const newHref = prompt('修改链接（留空不修改）：', item.link || '#');
            if (newHref !== null && newHref.trim()) item.link = newHref.trim();
            await saveData(appData); renderAllMenus();
        };
        window.deleteMenuItem = async (btn) => {
            if (!confirm('确定删除吗？')) return;
            const wrapper = btn.closest('.menu-item-wrapper');
            const cat = wrapper.closest('[data-cat]');
            const key = cat.dataset.menu.replace('menu-','');
            const catIdx = parseInt(cat.dataset.catIndex);
            const items = appData.menus[key].categories[catIdx].items;
            const itemIdx = Array.from(cat.querySelectorAll('.menu-item-wrapper')).indexOf(wrapper);
            items.splice(itemIdx, 1);
            await saveData(appData); renderAllMenus();
        };

        window.editCategory = (btn) => {
            const cat = btn.closest('[data-cat]');
            const key = cat.dataset.menu.replace('menu-','');
            const catIdx = parseInt(cat.dataset.catIndex);
            const c = appData.menus[key].categories[catIdx];
            document.getElementById('editCatName').value = c.name;
            document.getElementById('editCatFontSize').value = c.fontSize;
            document.getElementById('editCatFontWeight').value = c.fontWeight;
            document.getElementById('editCatColor').value = c.color;
            document.getElementById('editCatLink').value = c.link || '';
            document.getElementById('editCategoryModal').classList.add('active');
            window._editingCat = { menuId: key, catIdx };
        };
        window.saveEditCategory = async () => {
            const { menuId, catIdx } = window._editingCat;
            const c = appData.menus[menuId].categories[catIdx];
            c.name = document.getElementById('editCatName').value.trim();
            c.fontSize = document.getElementById('editCatFontSize').value;
            c.fontWeight = document.getElementById('editCatFontWeight').value;
            c.color = document.getElementById('editCatColor').value;
            c.link = document.getElementById('editCatLink').value.trim();
            await saveData(appData); renderAllMenus();
            document.getElementById('editCategoryModal').classList.remove('active');
        };
        window.deleteCategory = async () => {
            if (!confirm('确定删除该分类及所有软件项吗？')) return;
            const { menuId, catIdx } = window._editingCat;
            appData.menus[menuId].categories.splice(catIdx, 1);
            await saveData(appData); renderAllMenus();
            document.getElementById('editCategoryModal').classList.remove('active');
        };
        window.submitAddCategory = async () => {
            const menuId = document.getElementById('catNavSelect').value;
            const name = document.getElementById('catNameInput').value.trim();
            if (!name) return alert('请输入分类名称');
            appData.menus[menuId].categories.push({
                name,
                fontSize: document.getElementById('catFontSize').value,
                fontWeight: document.getElementById('catFontWeight').value,
                color: document.getElementById('catColorInput').value,
                link: document.getElementById('catLinkInput').value.trim(),
                items: []
            });
            await saveData(appData); renderAllMenus();
            document.getElementById('addCategoryModal').classList.remove('active');
        };

        window.openAddModal = () => {
            document.getElementById('addModal').classList.add('active');
            ['modalName','modalLink','modalContributor','modalIconUrl'].forEach(id => document.getElementById(id).value = '');
            updateIconPreview('');
        };
        window.closeAddModal = (e) => { if (!e || e.target === e.currentTarget) document.getElementById('addModal').classList.remove('active'); };
        window.updateIconPreview = (url) => {
            const p = document.getElementById('iconPreview');
            p.innerHTML = url && url.trim() ? `<span style="color:#6b7280;">预览：</span><img src="${url}" onerror="this.style.display='none'" style="max-height:30px;">` : '';
        };
        document.addEventListener('DOMContentLoaded', () => { const inp = document.getElementById('modalIconUrl'); if(inp) inp.addEventListener('input', function(){ updateIconPreview(this.value); }); });
        window.submitAdd = async () => {
            const name = document.getElementById('modalName').value.trim();
            if (!name) return alert('请输入软件名称');
            appData.champions.push({
                name,
                link: document.getElementById('modalLink').value.trim() || '#',
                contributor: document.getElementById('modalContributor').value.trim() || '匿名贡献',
                iconUrl: document.getElementById('modalIconUrl').value.trim()
            });
            await saveData(appData); renderChampions();
            document.getElementById('addModal').classList.remove('active');
        };
        window.editChampionItem = async (btn) => {
            const wrapper = btn.closest('.champion-item-wrapper');
            const idx = parseInt(wrapper.dataset.championIndex);
            const ch = appData.champions[idx];
            const newName = prompt('修改软件名称：', ch.name);
            if (newName && newName.trim()) ch.name = newName.trim();
            const newContributor = prompt('修改贡献者：', ch.contributor);
            if (newContributor && newContributor.trim()) ch.contributor = newContributor.trim();
            const newHref = prompt('修改链接：', ch.link);
            if (newHref !== null && newHref.trim()) ch.link = newHref.trim();
            await saveData(appData); renderChampions();
        };
        window.deleteChampionItem = async (btn) => {
            if (!confirm('确定要删除这个软件吗？')) return;
            const wrapper = btn.closest('.champion-item-wrapper');
            const idx = parseInt(wrapper.dataset.championIndex);
            appData.champions.splice(idx, 1);
            await saveData(appData); renderChampions();
        };

        let currentSlide = 0;
        const renderSlide = (index) => {
            const s = appData.slides[index];
            const container = document.getElementById('heroSlideContainer');
            container.innerHTML = `<h1 class="text-4xl lg:text-6xl font-bold text-white mb-6 leading-tight">${s.title}</h1><p class="text-xl lg:text-2xl text-gray-400 mb-4 max-w-3xl mx-auto">${s.desc}</p><p class="text-lg text-gray-500 mb-10 max-w-2xl mx-auto">${s.sub}</p><div class="flex flex-col sm:flex-row gap-4 justify-center"><button class="px-8 py-3 border border-brand-orange text-brand-orange rounded-lg font-medium hover:bg-brand-orange/10 transition-all hero-btn" style="border-color:${s.btnColor}; color:${s.btnColor};">${s.btnText}</button></div>`;
            container.querySelector('.hero-btn').onclick = () => { if (s.btnLink && s.btnLink !== '#') window.open(s.btnLink, '_blank'); };
            document.querySelectorAll('#heroIndicators .indicator-dot').forEach((dot, i) => dot.classList.toggle('active', i === index));
        };
        const renderIndicators = () => {
            document.getElementById('heroIndicators').innerHTML = appData.slides.map((_, i) =>
                `<button class="indicator-dot ${i === currentSlide ? 'active' : ''}" onclick="goToSlide(${i})"></button>`).join('');
        };
        window.changeSlide = (d) => { currentSlide = (currentSlide + d + appData.slides.length) % appData.slides.length; renderSlide(currentSlide); };
        window.goToSlide = (i) => { currentSlide = i; renderSlide(currentSlide); };
        window.openHeroEditModal = () => {
            const s = appData.slides[currentSlide];
            const temp = document.createElement('div'); temp.innerHTML = s.title;
            document.getElementById('editHeroTitle').value = temp.textContent || '';
            document.getElementById('editHeroDesc').value = s.desc;
            document.getElementById('editHeroSub').value = s.sub;
            document.getElementById('editHeroBtnText').value = s.btnText;
            document.getElementById('editHeroBtnLink').value = s.btnLink;
            document.getElementById('editHeroBtnColor').value = s.btnColor;
            document.getElementById('editHeroBgColor').value = s.bgColor || '#000000';
            document.getElementById('heroEditModal').classList.add('active');
        };
        window.closeHeroEditModal = (e) => { if (!e || e.target === e.currentTarget) document.getElementById('heroEditModal').classList.remove('active'); };
        window.saveHeroEdit = async () => {
            const s = appData.slides[currentSlide];
            s.title = document.getElementById('editHeroTitle').value.trim() || s.title;
            s.desc = document.getElementById('editHeroDesc').value.trim() || s.desc;
            s.sub = document.getElementById('editHeroSub').value.trim() || s.sub;
            s.btnText = document.getElementById('editHeroBtnText').value.trim() || '按钮';
            s.btnLink = document.getElementById('editHeroBtnLink').value.trim() || '#';
            s.btnColor = document.getElementById('editHeroBtnColor').value;
            s.bgColor = document.getElementById('editHeroBgColor').value;
            await saveData(appData); renderSlide(currentSlide);
            document.getElementById('heroEditModal').classList.remove('active');
        };

        window.openNavEditModal = () => {
            document.getElementById('navEditModal').classList.add('active');
            document.querySelectorAll('.nav-item-text').forEach((el, i) => {
                const ids = ['edit-app','edit-driver','edit-design','edit-system','edit-tool'];
                document.getElementById(ids[i]).value = el.textContent.trim();
            });
        };
        window.closeNavEditModal = (e) => { if (!e || e.target === e.currentTarget) document.getElementById('navEditModal').classList.remove('active'); };
        window.saveNavEdit = () => {
            const ids = ['edit-app','edit-driver','edit-design','edit-system','edit-tool'];
            document.querySelectorAll('.nav-item-text').forEach((el, i) => {
                const val = document.getElementById(ids[i]).value.trim();
                if (val) el.textContent = val;
            });
            document.getElementById('navEditModal').classList.remove('active');
        };

        window.openMenuAddModal = (menuId) => {
            const menu = document.getElementById(menuId);
            if (!menu) return;
            document.getElementById('currentMenuId').value = menuId;
            const select = document.getElementById('menuCatSelect');
            select.innerHTML = '';
            const key = menuId.replace('menu-','');
            (appData.menus[key]?.categories || []).forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.name; opt.textContent = cat.name;
                select.appendChild(opt);
            });
            document.getElementById('menuItemName').value = '';
            document.getElementById('menuItemLink').value = '';
            document.getElementById('menuAddModal').classList.add('active');
        };
        window.closeMenuAddModal = (e) => { if (!e || e.target === e.currentTarget) document.getElementById('menuAddModal').classList.remove('active'); };
        window.submitMenuAdd = async () => {
            const menuId = document.getElementById('currentMenuId').value;
            const catName = document.getElementById('menuCatSelect').value;
            const name = document.getElementById('menuItemName').value.trim();
            if (!name) return alert('请输入软件名称');
            const link = document.getElementById('menuItemLink').value.trim() || '#';
            const key = menuId.replace('menu-','');
            const cat = appData.menus[key]?.categories.find(c => c.name === catName);
            if (!cat) return alert('分类不存在');
            cat.items.push({ name, link });
            await saveData(appData); renderAllMenus();
            document.getElementById('menuAddModal').classList.remove('active');
        };

        const VALID_ACCOUNT = "admin", VALID_PASSWORD = "fjt13417693170";
        const isLoggedIn = () => localStorage.getItem('sw_logged') === 'true';
        const setLoginState = (state) => {
            localStorage.setItem('sw_logged', state);
            document.body.classList.toggle('logged-in', state);
            const btn = document.getElementById('cornerLoginBtn');
            btn.title = state ? '退出登录' : '登录';
        };
        document.getElementById('cornerLoginBtn').addEventListener('click', () => {
            if (isLoggedIn()) { if (confirm('确定退出登录吗？')) setLoginState(false); }
            else { document.getElementById('loginModal').classList.add('active'); }
        });
        window.doLogin = () => {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            if (user === VALID_ACCOUNT && pass === VALID_PASSWORD) {
                setLoginState(true);
                document.getElementById('loginModal').classList.remove('active');
                alert('登录成功！');
            } else alert('账号或密码错误');
        };
        window.closeLoginModal = (e) => { if (!e || e.target === e.currentTarget) document.getElementById('loginModal').classList.remove('active'); };

        let internalBtnHover = 0;
        const bindInternalBtns = () => {
            document.addEventListener('mouseenter', e => {
                if (e.target.closest('.cat-actions button, .menu-item-actions button')) {
                    internalBtnHover++;
                    document.getElementById('mainNav').classList.add('nav-white');
                    if (window._menuCloseTimeout) { clearTimeout(window._menuCloseTimeout); window._menuCloseTimeout = null; }
                }
            }, true);
            document.addEventListener('mouseleave', e => {
                if (e.target.closest('.cat-actions button, .menu-item-actions button')) {
                    internalBtnHover = Math.max(0, internalBtnHover - 1);
                }
            }, true);
        };
        (function() {
            const nav = document.getElementById('mainNav');
            const menus = nav.querySelectorAll('.mega-menu');
            const triggers = nav.querySelectorAll('[data-menu]');
            let currentMenu = null, exitTimeout = null, mouseInside = 0;
            const makeWhite = () => nav.classList.add('nav-white');
            const resetWhite = () => nav.classList.remove('nav-white');
            const show = (id) => {
                if (currentMenu && currentMenu.id !== id) currentMenu.classList.remove('active');
                const m = document.getElementById(id);
                if (m) { m.classList.add('active'); currentMenu = m; }
                clearTimeout(exitTimeout); makeWhite();
            };
            const scheduleClose = () => {
                if (exitTimeout) clearTimeout(exitTimeout);
                exitTimeout = setTimeout(() => {
                    if (mouseInside <= 0 && currentMenu && internalBtnHover <= 0) {
                        currentMenu.classList.remove('active'); currentMenu = null; resetWhite();
                    }
                }, 150);
            };
            const enter = () => { mouseInside++; clearTimeout(exitTimeout); makeWhite(); };
            const leave = () => {
                mouseInside = Math.max(0, mouseInside - 1);
                if (mouseInside === 0) {
                    if (currentMenu && internalBtnHover <= 0) scheduleClose();
                    else if (!currentMenu && internalBtnHover <= 0) {
                        exitTimeout = setTimeout(() => { if (mouseInside === 0 && internalBtnHover <= 0) resetWhite(); }, 150);
                    }
                }
            };
            nav.addEventListener('mouseenter', enter);
            nav.addEventListener('mouseleave', leave);
            menus.forEach(m => { m.addEventListener('mouseenter', enter); m.addEventListener('mouseleave', leave); });
            triggers.forEach(trigger => {
                const btn = trigger.querySelector('button');
                const menuId = `menu-${trigger.dataset.menu}`;
                btn.addEventListener('mouseenter', () => show(menuId));
                btn.addEventListener('mouseleave', leave);
                const menu = document.getElementById(menuId);
                if (menu) {
                    menu.addEventListener('click', e => {
                        if (e.target.tagName === 'A' && e.target.classList.contains('menu-item-link') && !e.target.closest('.menu-item-actions')) {
                            menu.classList.remove('active'); currentMenu = null; mouseInside = 0; clearTimeout(exitTimeout); resetWhite();
                        }
                    });
                }
            });
            nav.addEventListener('mouseleave', e => {
                if (!nav.contains(e.relatedTarget) && !Array.from(menus).some(m => m.classList.contains('active'))) {
                    mouseInside = 0; clearTimeout(exitTimeout); resetWhite();
                }
            });
        })();

        (async function init() {
            appData = await loadData();
            if (isLoggedIn()) setLoginState(true); else setLoginState(false);
            renderAllMenus();
            renderChampions();
            renderSlide(currentSlide);
            renderIndicators();
            bindInternalBtns();
        })();
    </script>
</body>
</html>
